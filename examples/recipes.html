  glasspipette: ['액체를 정확한 부피만큼 옮기는 유리관이에요. 눈금 피펫은 여러 양을, 홀 피펫은 정해진 한 가지 양을 옮겨요.', '피펫 필러로 표선 위까지 빨아올린 뒤, 눈높이에서 메니스커스 아래쪽을 표선(눈금)에 맞춰 내보내요.', '입으로 빨아올리지 않아요.'],

  funnel: ['액체를 입구가 좁은 그릇에 옮기거나, 거름종이를 끼워 고체와 액체를 거를 때 써요.', '거름종이를 접어 끼우고 물로 적셔 붙인 뒤 유리 막대를 따라 부어요. 깔때기 끝의 긴 쪽을 받는 그릇 벽에 대요.', '거름종이보다 높게 붓지 않아요.'],

  evapdish: ['용액을 가열해 물을 날려 보내고, 녹아 있던 고체를 얻을 때 쓰는 사기 접시예요.', '삼발이와 쇠그물 위에서 약하게 가열하고, 거의 마르면 불을 끄고 남은 열로 말려요.', '가열 중에 고체가 튈 수 있으니 얼굴을 가까이 대지 않아요. 뜨거운 접시는 도가니 집게로 옮겨요.'],

  gasburner: ['가스를 태워 센 불로 가열하는 기구예요.', '두 조절 나사가 잠긴 것을 확인하고 중간 밸브와 콕을 연 뒤, 불을 대고 가스 조절 나사를 열어요. 공기 조절 나사로 푸른 불꽃이 되게 맞춰요. 끌 때는 켤 때의 거꾸로 공기 조절 나사, 가스 조절 나사, 콕, 중간 밸브 순으로 잠가요.', '노란 불꽃은 그을음이 생기니 공기를 조금 더 넣어요. 가스 냄새가 나면 바로 밸브를 잠그고 선생님께 알려요.'],
  tripod: ['가열할 그릇을 알코올램프나 가스버너 위에 올려놓는 받침이에요. 위에 쇠그물을 깔아 열이 고르게 전해지게 해요.', '겉불꽃이 쇠그물에 닿도록 높이를 맞춰요.', '가열한 뒤에는 삼발이와 쇠그물이 한동안 뜨거우니 만지지 않아요.'],

  balance: ['물체의 질량을 재는 기구예요.', '평평한 곳에 놓고 수평과 영점을 맞춰요. 약포지나 무게 접시를 먼저 올려 영점을 맞춘(용기 무게를 뺀) 뒤 시료를 올려요.', '잴 수 있는 최대 질량을 넘지 않게 해요. 시약을 저울 판에 직접 올리지 않아요. 바람이 불면 값이 흔들려요.'],

  st.textContent = `body{background:#fff}#app{display:grid;grid-template-columns:repeat(${all ? 2 : 1},${cw}px);gap:16px;padding:16px;width:max-content}.shot b{display:block;height:30px;line-height:30px;font-size:${all ? 15 : 18}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shot .scene{display:block;width:${cw}px;height:${cw * LabKit.H / LabKit.W}px;outline:1px solid #e4d9f1}`;
  document.head.appendChild(st);
  app.innerHTML = list.map(cell).join(''); app.removeAttribute('aria-busy'); afterFonts(() => LabKit.overlaps(app, { mark: true }));
  return;
}
if (CHECK) document.documentElement.classList.add('lk-check'); // 점검 화면은 결과 장면도 함께 보인다
app.innerHTML = page(); app.removeAttribute('aria-busy'); LabKit.fit(app); initSketches(app); if (CHECK) afterFonts(() => LabKit.overlaps(app, { mark: true }));
function clearWrites() { if (!confirm('이 기기에 적은 내용을 모두 지울까요?')) return; saved = {}; persist(); document.querySelectorAll('[data-w]').forEach(w => { w.innerHTML = ''; }); initSketches(document); pcReset(); }
// 고른 예상이 지워지거나 바뀌면, 다시 잠긴 단계의 결과 보기를 닫는다
function pcReset() { refreshPc(); [...rvOn].forEach(i => { if (i !== 'res' && pcWait(i)) { rvOn.delete(i); document.querySelectorAll(`[data-rvs="${i}"]`).forEach(n => { n.classList.remove('rv-on'); n.querySelectorAll('.rv-btn').forEach(b => { b.setAttribute('aria-pressed', false); b.querySelector('.rv-l').textContent = rvLabel(i); }); }); } }); if (deck3d && !deck.hidden) mountInline(); }
function syncAnswers() { document.querySelectorAll('[data-w]').forEach(w => { w.innerHTML = wtext(w.dataset.w); }); initSketches(document); pcReset(); updateSaveStatus(); }
function importStatus(text, error = false) { document.querySelectorAll('[data-import-status]').forEach(n => { n.textContent = text; n.dataset.state = error ? 'error' : 'ok'; }); }
function exportAnswers() {
  const data = { format: 'experiment-visualizer-answers', version: 1, experiment: KEY, title: D.title || '', answers: saved };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `${String(D.title || '실험').replace(/[\\/:*?"<>|]/g, '_')}_답안.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-answer-export],[data-answer-import]'); if (!b) return;
  if (b.hasAttribute('data-answer-export')) exportAnswers(); else b.closest('.save-note').querySelector('[data-answer-file]').click();
});
document.addEventListener('change', async ev => {
  const f = ev.target; if (!f.hasAttribute || !f.hasAttribute('data-answer-file')) return;
  const file = f.files && f.files[0]; if (!file) return;
  try {
    if (file.size > 16 * 1024 * 1024) throw new Error('답안 파일이 너무 커요 (16 MB 이하).');
    let data;
    try { data = JSON.parse(await file.text()); }
    catch (err) { throw new Error('답안 파일을 읽지 못했어요. 이 도구에서 내보낸 JSON 파일을 골라 주세요.'); }
    if (!data || data.format !== 'experiment-visualizer-answers' || data.version !== 1 || !answerObject(data.answers)) throw new Error('이 도구에서 내보낸 답안 JSON 파일을 골라 주세요.');
    if (data.experiment !== KEY) throw new Error('다른 실험의 답안이에요. 해당 실험 자료에서 가져와 주세요.');
    if (Object.keys(saved).length && !confirm('가져온 답안으로 현재 적은 내용을 바꿀까요? 현재 답안은 먼저 내보내 둘 수 있어요.')) { importStatus('가져오기를 취소했어요.'); return; }
    saved = data.answers; persist(); syncAnswers(); importStatus('답안을 가져왔어요.');
  } catch (err) { importStatus(err.message || '답안 파일을 읽지 못했어요.', true); }
  finally { f.value = ''; }
});
// 인쇄: 학생용은 결과 그림·예상 결과·메모를 빼고, 교사용은 결과 그림까지 함께 인쇄한다
function printAs(mode) {
  const root = document.documentElement, done = () => { delete root.dataset.print; window.removeEventListener('afterprint', done); };
  root.dataset.print = mode; window.addEventListener('afterprint', done); window.print();
}
const pmenu = app.querySelector('.pmenu'), pbtn = app.querySelector('.pbtn');
const setMenu = open => { if (!pmenu) return; pmenu.hidden = !open; pbtn.setAttribute('aria-expanded', open); if (open) pmenu.querySelector('button').focus(); };
app.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('.pbtn')) return setMenu(pmenu.hidden);
  const pm = t.closest('[data-pmode]'); if (pm) { setMenu(false); return printAs(pm.dataset.pmode); }
  const rv = t.closest('[data-rv]'); if (rv) return toggleReveal(rvKey(rv.dataset.rv));
  const v3 = t.closest('[data-v3]'); if (v3) return open3d(+v3.dataset.v3);
  const pl = t.closest('[data-play]'); if (pl) return playBtn(pl);
  const pkm = t.closest('[data-pkm]'); if (pkm) return pkMat(pkm);
  const px = t.closest('[data-pkx]'); if (px) { const c = px.closest('[data-pkmat]'); if (c) pkMatClose(c); return; }
  if (t.closest('[data-still]')) return setStill(!still);
  if (t.closest('[data-answer-export],[data-answer-import],[data-answer-file]')) return;
  if (t.closest('[data-clear]')) return clearWrites();
  const ob = t.closest('[data-origin]'); if (ob) { const on = document.documentElement.classList.toggle('lk-origin'); ob.setAttribute('aria-pressed', on); ob.textContent = on ? '원문 대조 감추기' : '원문 대조 보기'; return; }
  if (t.closest('[data-w], [data-skg], [data-pc]')) return; // 적는 칸·그림 칸·예상 보기를 누르면 수업 모드를 열지 않는다
  const o = t.closest('[data-open]'); if (o) return openDeck(+o.dataset.open);
  const st = t.closest('.step'); if (st) openDeck(stepStart + +st.dataset.step);
});
document.addEventListener('click', ev => { if (pmenu && !pmenu.hidden && !ev.target.closest('.pwrap')) setMenu(false); });
document.addEventListener('input', ev => {
  const w = ev.target.closest && ev.target.closest('[data-w]'); if (!w) return;
  const v = w.innerText.replace(/\n+$/, '');
  if (v.trim()) saved[w.dataset.w] = v; else { delete saved[w.dataset.w]; if (!w.textContent.trim()) w.innerHTML = ''; }
  persist();
});
if (Q.has('slide')) openDeck((+Q.get('slide') || 1) - 1);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lkStart); else lkStart();
})();
</script>
</body>
