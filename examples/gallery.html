const coverItems = D.cover ? resolveScene(D.cover, -1, '표지', []) : [{ t: 'flask', x: 150, fill: .5, color: 'violet', bubbles: 5 }, { t: 'beaker', id: 'cb', x: 262, fill: .4, color: 'water' }, { t: 'rack', x: 382, tubes: [{ fill: .45, color: 'pink' }, { fill: .45, color: 'yellow' }, { fill: .45, color: 'green' }] }, { t: 'dropper', over: 'cb', dy: 18, color: 'violet' }];
const chips = () => [D.subject && `<span class="chip primary">${e(D.subject)}</span>`, D.unit && `<span class="chip">${IC.book}${e(D.unit)}</span>`, D.duration && `<span class="chip">${IC.clock}${e(D.duration)}</span>`, D.group && `<span class="chip">${IC.users}${e(D.group)}</span>`].filter(Boolean).join('');
const matGrid = () => `<div class="mat-grid">${mats.map(m => `<div class="mat">${LabKit.icon(m.icon, m.name)}<div class="nm">${e(m.name)}</div>${m.qty ? `<div class="qty">${e(m.qty)}</div>` : ''}</div>`).join('')}</div>`;
const tipList = () => `<div class="safety">${tips.map(s => `<div class="safe tipl"><span class="ic">${IC.star}</span><div>${md(s)}</div></div>`).join('')}</div>`;
const safeList = () => `<div class="safety">${safety.map(s => `<div class="safe"><span class="ic">${IC.alert}</span><div>${md(s)}</div></div>`).join('')}</div>`;
const tableHtml = (t, ti) => { if (!t || !arr(t.head).length) return ''; return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${arr(t.head).map(h => `<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${arr(t.rows).map((r, ri) => `<tr>${arr(r).map((c, ci) => c === '' || c == null ? `<td class="in" contenteditable="true" aria-label="${e(arr(t.head)[ci] || '')} 칸에 적기" data-w="${e(ak(`t${ti}.${ri}.${ci}`))}">${wtext(ak(`t${ti}.${ri}.${ci}`))}</td>` : `<td>${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; };
const hasWrite = steps.some(st => arr(st.predict).length) || arr(res.questions).length > 0 || arr(res.tables || res.table).some(tb => tb && arr(tb.rows).some(r => arr(r).some(c => c === '' || c == null)));
const saveNote = () => hasWrite ? `<div class="save-note"><span>적은 내용은 이 기기의 브라우저에만 저장돼요.</span><button class="btn sm" type="button" data-clear>적은 내용 지우기</button></div>` : '';
const hasRes = res.expect || arr(res.tables || res.table).some(tb => tb && arr(tb.head).length) || arr(res.questions).length || res.conclusion;
const resHidden = (cls, title, body) => `<div class="card ${cls}${rvOn.has('res') ? ' rv-on' : ''}" data-rvs="res"><h3>${IC.flask}${title}</h3><p class="rv-hide">실험을 마친 뒤 '결과 보기'를 눌러 확인해요.</p><div class="rv-body"><p>${md(body)}</p></div><button class="btn sm rv-btn" type="button" data-rv="res" aria-pressed="${rvOn.has('res')}">${IC.eye}<span class="rv-l">${rvOn.has('res') ? '감추기' : '결과 보기'}</span></button></div>`;
const resCards = () => [res.expect && resHidden('res-expect', '예상 결과', res.expect), res.conclusion && resHidden('res-conc', '정리', res.conclusion), arr(res.tables || res.table).map((tb, ti) => tb && arr(tb.head).length ? `<div class="card wide"><h3>${IC.table}${e(tb.title || '결과 기록표')}</h3>${tableHtml(tb, ti)}</div>` : '').join(''), arr(res.questions).length && `<div class="card${res.table ? '' : ''}"><h3>${IC.q}생각해 보기</h3><ol class="qs">${arr(res.questions).map((q, k) => `<li><div>${md(qText(q))}${writeBox(ak(`q${k}`), '내 생각을 적어요', 'ans')}</div></li>`).join('')}</ol></div>`].filter(Boolean).join('');
const emptyState = `<div class="card empty">${LabKit.scene([{ t: 'beaker', x: 200, fill: 0 }, { t: 'dropper', x: 200, y: 110, drops: false }, { t: 'note', x: 340, y: 120, text: '실험 단계를 기다리는 중이에요', icon: 'idea' }], { label: '빈 상태' }).replace('class="scene"', 'class="scene ill"')}<b>아직 실험 단계가 없어요</b><span>실험지 내용을 넣으면 이곳에 단계별 그림이 나타나요!</span></div>`;

function page() {
  const h = [];
  h.push(`<header class="hero wrap"><div class="hero-card"><div><div class="chips">${chips()}</div><h1>${e(D.title || '실험 과정 안내')}</h1><div class="pname"><span>학년 반<i></i></span><span>번호<i></i></span><span>이름<i></i></span></div>${D.goal ? `<p class="goal">${md(D.goal)}</p>` : ''}<div class="toolbar"><button class="btn primary" data-open="0">${IC.play}수업 모드로 보기</button><div class="pwrap"><button class="btn pbtn" type="button" aria-haspopup="true" aria-expanded="false">${IC.print}인쇄하기</button><div class="pmenu" role="menu" hidden><button type="button" role="menuitem" data-pmode="student"><b>학생용 학습지</b><span>그림·과정·적는 칸 (결과 그림과 예상 결과는 빼요)</span></button><button type="button" role="menuitem" data-pmode="teacher"><b>교사용</b><span>결과 그림·예상 결과·원문 확인 메모까지</span></button></div></div></div>${D._demo ? '<div class="demo">지금 보이는 내용은 템플릿의 예시 데이터예요. 실험지 내용으로 바꿔 주세요.</div>' : ''}</div><div class="hero-art">${LabKit.scene(coverItems, { label: '표지 그림' })}</div></div></header><main class="wrap">`);
  if (mats.length) h.push(`<section><div class="sec-head"><span class="eyebrow">준비</span><h2>준비물</h2></div>${matGrid()}</section>`);
  if (safety.length) h.push(`<section><div class="sec-head"><span class="eyebrow">안전</span><h2>안전 수칙</h2></div>${safeList()}</section>`);
  if (tips.length) h.push(`<section><div class="sec-head"><span class="eyebrow">팁</span><h2>실험 전에 알아 두기</h2></div>${tipList()}</section>`);
  h.push(`<section><div class="sec-head"><span class="eyebrow">과정</span><h2>실험 과정</h2></div>`);
  h.push(steps.length ? `<div class="steps">${steps.map((st, i) => `${st.section && st.section !== (steps[i - 1] || {}).section ? `<div class="step-sec">${e(st.section)}</div>` : ''}<article class="step" tabindex="0" data-step="${i}" data-rvs="${i}" aria-label="${i + 1}단계 크게 보기">${sceneBlock(st, i)}<div><div class="meta"><span class="num">${e(st.no ?? i + 1)}</span>${st.time ? `<span class="time">${IC.clock}${e(st.time)}</span>` : ''}</div><h3>${e(st.title || `${i + 1}단계`)}</h3>${stepBoxes(st, i)}</div><span class="zoom-hint">${IC.zoom}크게 보기</span></article>`).join('')}</div>` : emptyState);
  h.push(`${hasRes ? '' : saveNote()}</section>`);
  if (hasRes) h.push(`<section><div class="sec-head"><span class="eyebrow">정리</span><h2>결과 정리</h2></div><div class="res-grid">${resCards()}</div>${saveNote()}</section>`);
  h.push(`<footer class="foot">${D.source ? `원문: ${e(D.source)}<br>` : ''}${D.notes ? `<span class="notes">${md(D.notes)}<br></span>` : ''}${hasOrigin ? '<button class="btn sm o-btn" type="button" data-origin aria-pressed="false">원문 대조 보기</button><br>' : ''}그림은 이해를 돕기 위한 모식도로, 실제 기구의 모양·크기와 다를 수 있어요. 실험은 반드시 선생님의 안내에 따라 진행하세요.<br>만든 도구: <a href="https://github.com/sci-eum/experiment-visualizer" target="_blank" rel="noopener">experiment-visualizer</a> v${LabKit.version}</footer></main>`);
  return h.join('');
}

/* ----- 수업 모드 ----- */
const slides = [];
slides.push({ name: '표지', html: () => `<div class="slide"><div class="scene-box">${LabKit.scene(coverItems, { label: '표지 그림' })}</div><div><div class="chips">${chips()}</div><h2>${e(D.title || '실험 과정 안내')}</h2>${D.goal ? `<p class="txt">${md(D.goal)}</p>` : ''}</div></div>` });
if (mats.length) slides.push({ name: '준비물', html: () => `<div class="slide one"><div><div class="sec-head"><span class="eyebrow">준비</span><h2 style="margin:0">준비물</h2></div>${matGrid()}</div></div>` });
if (safety.length) slides.push({ name: '안전 수칙', html: () => `<div class="slide one"><div><div class="sec-head"><span class="eyebrow">안전</span><h2 style="margin:0">안전 수칙</h2></div>${safeList()}</div></div>` });
if (tips.length) slides.push({ name: '실험 팁', html: () => `<div class="slide one"><div><div class="sec-head"><span class="eyebrow">팁</span><h2 style="margin:0">실험 전에 알아 두기</h2></div>${tipList()}</div></div>` });
const stepStart = slides.length;
steps.forEach((st, i) => slides.push({ name: `${i + 1}단계`, step: i, html: () => `<div class="slide${rvOn.has(i) ? ' rv-on' : ''}" data-rvs="${i}">${sceneBlock(st, i)}<div><div class="meta"><span class="num">${e(st.no ?? i + 1)}</span>${st.section ? `<span class="sec-chip">${e(st.section)}</span>` : ''}${st.time ? `<span class="time">${IC.clock}${e(st.time)}</span>` : ''}</div><h2>${e(st.title || `${i + 1}단계`)}</h2>${stepBoxes(st, i)}${timerUi(st, i)}</div></div>` }));
if (hasRes) slides.push({ name: '결과 정리', res: true, html: () => `<div class="slide one"><div><div class="sec-head"><span class="eyebrow">정리</span><h2 style="margin:0">결과 정리</h2></div><div class="res-grid">${resCards()}</div></div></div>` });

const mk = (id, cls) => { let n = document.getElementById(id); if (!n) { n = document.createElement('div'); n.id = id; if (cls) n.className = cls; document.body.appendChild(n); } return n; };
const deck = mk('deck', 'deck'); deck.hidden = true; deck.setAttribute('role', 'dialog'); deck.setAttribute('aria-modal', 'true'); deck.setAttribute('aria-label', '수업 모드');
let cur = 0, lastFocus = null;
function showSlide(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  deck.querySelector('.deck-stage').innerHTML = slides[cur].html();
  deck.querySelector('.deck-count').textContent = `${cur + 1} / ${slides.length}`;
  deck.querySelectorAll('.dot').forEach((d, k) => { d.classList.toggle('on', k === cur); d.setAttribute('aria-current', k === cur ? 'step' : 'false'); });
  deck.querySelector('[data-prev]').disabled = cur === 0; deck.querySelector('[data-next]').disabled = cur === slides.length - 1;
  LabKit.fit(deck); if (Q.has('check')) afterFonts(() => LabKit.overlaps(deck, { mark: true }));
  if (tm) tmRender();
}
function openDeck(i) {
  lastFocus = document.activeElement;
  deck.innerHTML = `<div class="deck-top"><div class="deck-title">${e(D.title || '실험 과정')}</div><span class="tm-mini" hidden></span><span class="deck-count"></span><button class="btn icon" data-full aria-label="전체 화면">${IC.full}</button><button class="btn icon" data-close aria-label="닫기">${IC.x}</button></div><div class="deck-stage"></div><div class="deck-nav"><button class="btn" data-prev>${IC.left}이전</button><div class="dots">${slides.map((s, k) => `<button class="dot" data-go="${k}" aria-label="${e(s.name)}"></button>`).join('')}</div><button class="btn primary" data-next>다음${IC.right}</button></div>`;
  deck.hidden = false; document.body.style.overflow = 'hidden'; showSlide(i); deck.querySelector('[data-next]').focus();
}
function closeDeck() { deck.hidden = true; document.body.style.overflow = ''; app.querySelectorAll('[data-w]').forEach(w => { w.innerHTML = wtext(w.dataset.w); }); if (document.fullscreenElement) document.exitFullscreen().catch(() => { }); if (lastFocus) lastFocus.focus(); }
deck.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; if (b.dataset.rv != null) return toggleReveal(rvKey(b.dataset.rv)); if (b.dataset.tm) return tmAction(b.dataset.tm, +b.dataset.i); if (b.hasAttribute('data-clear')) return clearWrites(); if (b.hasAttribute('data-close')) closeDeck(); else if (b.hasAttribute('data-prev')) showSlide(cur - 1); else if (b.hasAttribute('data-next')) showSlide(cur + 1); else if (b.dataset.go) showSlide(+b.dataset.go); else if (b.hasAttribute('data-full')) { if (document.fullscreenElement) document.exitFullscreen(); else if (deck.requestFullscreen) deck.requestFullscreen().catch(() => { }); } });
document.addEventListener('keydown', ev => { if (ev.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName || '')) return; if (ev.key === 'Escape') { const pm = app.querySelector('.pmenu:not([hidden])'); if (pm) { pm.hidden = true; return; } } if (deck.hidden) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('step')) { ev.preventDefault(); openDeck(stepStart + +ev.target.dataset.step); } return; } if (['ArrowRight', 'PageDown', ' '].includes(ev.key)) { ev.preventDefault(); showSlide(cur + 1); } else if (['ArrowLeft', 'PageUp'].includes(ev.key)) { ev.preventDefault(); showSlide(cur - 1); } else if (ev.key === 'Escape' && !document.fullscreenElement) closeDeck(); else if ((ev.key === 'r' || ev.key === 'R') && slides[cur].step != null && revealOf(steps[slides[cur].step])) toggleReveal(slides[cur].step); else if ((ev.key === 'r' || ev.key === 'R') && slides[cur].res && (res.expect || res.conclusion)) toggleReveal('res'); else if (ev.key === 'Home') showSlide(0); else if (ev.key === 'End') showSlide(slides.length - 1); });
let tx = null; deck.addEventListener('touchstart', ev => { tx = ev.touches[0].clientX; }, { passive: true }); deck.addEventListener('touchend', ev => { if (tx == null) return; const dx = ev.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) showSlide(cur + (dx < 0 ? 1 : -1)); tx = null; });

const app = mk('app'), CHECK = Q.has('check');
// 겹침 점검은 화면 글자에 쓰인 글꼴 조각을 다 불러온 뒤에 한다 (Pretendard는 글자별로 나눠 불러와서, 덜 불러오면 글자 상자 크기가 달라진다)
function afterFonts(f) {
  if (!document.fonts || !document.fonts.load) return f();
  const txt = [...document.querySelectorAll('svg text')].map(t => t.textContent).join('') || '가A1';
  Promise.all(['500', '600', '700', '800'].map(w => document.fonts.load(`${w} 12px "Pretendard Variable"`, txt))).catch(() => { }).then(() => document.fonts.ready).then(f, f);
}
// 그림 점검용 촬영 화면 (check_render.py --shots): ?shot=3 은 3단계 장면 하나를 크게, ?shot=all 은 모든 장면을 한 장에
if (Q.has('shot')) {
  const v = Q.get('shot'), all = v === 'all', cw = all ? 480 : 960;
  LabKit.setAnim(false);
  const list = all ? [...(D.cover ? [-1] : []), ...steps.flatMap((st, i) => revealScene(st, i) ? [i, `${i}r`] : [i])] : [/r$/.test(v) ? `${(parseInt(v) || 1) - 1}r` : (+v || 1) - 1];
  const cell = i => typeof i === 'string' ? (steps[parseInt(i)] ? `<div class="shot"><b>${parseInt(i) + 1}. ${e(steps[parseInt(i)].title || '')} — 결과</b>${revealScene(steps[parseInt(i)], parseInt(i))}</div>` : '') : i < 0 ? `<div class="shot"><b>표지</b>${LabKit.scene(coverItems, { label: '표지 그림', grid: GRID })}</div>`
    : steps[i] ? `<div class="shot"><b>${i + 1}. ${e(steps[i].title || '')}</b>${sceneOf(steps[i], i)}</div>` : `<div class="shot"><b>${i + 1}단계가 없어요</b></div>`;
  const st = document.createElement('style');
  st.textContent = `body{background:#fff}#app{display:grid;grid-template-columns:repeat(${all ? 2 : 1},${cw}px);gap:16px;padding:16px;width:max-content}.shot b{display:block;height:30px;line-height:30px;font-size:${all ? 15 : 18}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shot .scene{display:block;width:${cw}px;height:${cw * LabKit.H / LabKit.W}px;outline:1px solid #e4d9f1}`;
  document.head.appendChild(st);
  app.innerHTML = list.map(cell).join(''); app.removeAttribute('aria-busy'); afterFonts(() => LabKit.overlaps(app, { mark: true }));
  return;
}
if (CHECK) document.documentElement.classList.add('lk-check'); // 점검 화면은 결과 장면도 함께 보인다
app.innerHTML = page(); app.removeAttribute('aria-busy'); LabKit.fit(app); if (CHECK) afterFonts(() => LabKit.overlaps(app, { mark: true }));
function clearWrites() { if (!confirm('이 기기에 적은 내용을 모두 지울까요?')) return; saved = {}; persist(); document.querySelectorAll('[data-w]').forEach(w => { w.innerHTML = ''; }); }
// 인쇄: 학생용은 결과 그림·예상 결과·메모를 빼고, 교사용은 결과 그림까지 함께 인쇄한다
function printAs(mode) {
  const root = document.documentElement, done = () => { delete root.dataset.print; window.removeEventListener('afterprint', done); };
  root.dataset.print = mode; window.addEventListener('afterprint', done); window.print();
}
const pmenu = app.querySelector('.pmenu'), pbtn = app.querySelector('.pbtn');
const setMenu = open => { if (!pmenu) return; pmenu.hidden = !open; pbtn.setAttribute('aria-expanded', open); if (open) pmenu.querySelector('button').focus(); };
app.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('.pbtn')) return setMenu(pmenu.hidden);
  const pm = t.closest('[data-pmode]'); if (pm) { setMenu(false); return printAs(pm.dataset.pmode); }
  const rv = t.closest('[data-rv]'); if (rv) return toggleReveal(rvKey(rv.dataset.rv));
  if (t.closest('[data-clear]')) return clearWrites();
  const ob = t.closest('[data-origin]'); if (ob) { const on = document.documentElement.classList.toggle('lk-origin'); ob.setAttribute('aria-pressed', on); ob.textContent = on ? '원문 대조 감추기' : '원문 대조 보기'; return; }
  if (t.closest('[data-w]')) return; // 적는 칸을 누르면 수업 모드를 열지 않는다
  const o = t.closest('[data-open]'); if (o) return openDeck(+o.dataset.open);
  const st = t.closest('.step'); if (st) openDeck(stepStart + +st.dataset.step);
});
document.addEventListener('click', ev => { if (pmenu && !pmenu.hidden && !ev.target.closest('.pwrap')) setMenu(false); });
document.addEventListener('input', ev => {
  const w = ev.target.closest && ev.target.closest('[data-w]'); if (!w) return;
  const v = w.innerText.replace(/\n+$/, '');
  if (v.trim()) saved[w.dataset.w] = v; else { delete saved[w.dataset.w]; if (!w.textContent.trim()) w.innerHTML = ''; }
  persist();
});
if (Q.has('slide')) openDeck((+Q.get('slide') || 1) - 1);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lkStart); else lkStart();
})();
</script>
</body>
</html>
