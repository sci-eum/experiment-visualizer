# 점검: main에 push하거나 PR을 열면, 그리고 배포(release.yml)에서 불러 쓴다.
# 엔진을 고친 뒤 template.html과 예시 HTML을 다시 만들어 올렸는지, 문서와 엔진이 맞는지,
# 예시 그림에 오류·겹침이 없는지, 입체 보기가 오류 없이 그려지는지 확인하고, 장면 그림(PNG)을 Artifact로 올린다.
name: 점검

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: template.html이 labkit.js와 같은지
        run: |
          python scripts/make_template.py
          git diff --exit-code --stat -- assets/template.html || { echo "::error::labkit.js를 고친 뒤 python scripts/make_template.py를 실행해 올리세요."; exit 1; }

      - name: 예시 HTML이 최신인지 (다시 만들어 비교)
        run: |
          python scripts/build_html.py examples/gallery.json examples/gallery.html
          python scripts/build_html.py examples/recipes.json examples/recipes.html
          python scripts/build_html.py examples/red-cabbage/experiment.json examples/red-cabbage/red-cabbage.html
          python scripts/build_html.py examples/red-cabbage/experiment.json examples/red-cabbage/red-cabbage-light.html --light
          git diff --exit-code --stat -- examples || { echo "::error::예시 HTML을 build_html.py로 다시 만들어 올리세요."; exit 1; }

      - name: 문서 점검 (JSON 문법, 엔진과 부품 목록, scenes.md·parts.json 최신, SKILL.md 길이)
        run: python scripts/check_docs.py

      - name: 자체 시험 (수식·부피 읽기, 엔진과 검사기의 부피 해석 일치, 검사기가 오류를 찾는지)
        run: python scripts/selftest.py

      - name: 예시 데이터 검사 (check_data.py)
        run: python scripts/check_data.py examples/gallery.json examples/recipes.json examples/red-cabbage/experiment.json

      - name: 수업 조작·답안 백업 검사 (넓은 화면·휴대폰 너비)
        run: python scripts/selftest_ui.py --require-browser

      - name: 그림 점검 (헤드리스 Chrome, 오류·겹침, 입체 보기까지, 가벼운 버전도 이 커밋의 엔진으로)
        run: python scripts/check_render.py examples/gallery.html examples/recipes.html examples/red-cabbage/red-cabbage.html examples/red-cabbage/red-cabbage-light.html --shots shots --strict --3d

      - name: 장면 그림 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14
